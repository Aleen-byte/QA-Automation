name: Web Tests - SauceDemo

on:
  push:
    paths:
      - "web-tests/**"
  pull_request:
    paths:
      - "web-tests/**"
  workflow_dispatch:

jobs:
  web-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Google Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependências
        working-directory: web-tests
        run: pip install -r requirements.txt

      - name: Executar testes web (headless)
        working-directory: web-tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: pytest

      - name: Upload relatório HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-report
          path: web-tests/report.html
